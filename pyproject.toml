[project]
name = "loredocs"
version = "0.1.22"
description = "Knowledge management MCP server for AI projects - search, tag, version, and organize your project knowledge"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Labyrinth Analytics Consulting" }
]
keywords = ["mcp", "claude", "knowledge-management", "ai-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp[cli]==1.28.1",
    "starlette==1.3.1",
    "click==8.3.3",
    "pydantic==2.12.5",
    "pdfplumber==0.11.9",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "cryptography==50.0.0",
    "packaging==25.0",
    # Semantic search moved from the [pro] extra to base on 2026-07-25
    # (spec amendment A1). fastembed runs BAAI/bge-small-en-v1.5 on
    # onnxruntime instead of torch: same 384-dim vectors, ~130MB instead
    # of ~300MB, one install path for every tier. Pro is a license flag.
    "lancedb==0.30.2",
    "pyarrow==24.0.0",
    "fastembed==0.8.0",
    # fastembed 0.8.0 caps onnxruntime <1.24 on Python <=3.13 but requires
    # >=1.24.2 on 3.14, so no single pin covers requires-python >=3.10.
    # Exact-pinned per marker rather than ranged (repo rule).
    "onnxruntime==1.23.2; python_version < '3.14'",
    "onnxruntime==1.28.0; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==1.3.0",
]
pro = [
    # semantic deps moved to base 2026-07-25 (spec amendment A1); kept so
    # [pro] installs don't break
]
token-count = [
    "tiktoken==0.7.0",
]
notion = [
    # Notion import bridge (SH-13222): vault_import_notion MCP tool + CLI.
    # Optional extra -- the server runs without it; the tool is conditionally
    # registered via _notion_extra_available() at startup.
    "notion-client==2.3.0",
    "keyring==23.13.1",
]

[project.scripts]
loredocs = "loredocs.server:main"
loredocs-compat-check = "loredocs.compat_check:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loredocs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
